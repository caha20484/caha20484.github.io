<!DOCTYPE html>
<html lang="uk" data-th="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PC Forge — конфігуратор ПК</title>
<meta name="theme-color" content="#070914">
<style>
:root{--bg:#070914;--tx:#e8eaf6;--mu:#8e94b5;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.1);--in:rgba(255,255,255,.06);--g:linear-gradient(135deg,#7c5cff,#00d0ff);--ac:#7c5cff;--pk:#ff3d9a;--ok:#2ee59d;--warn:#ffb020;--err:#ff5470}
html[data-th=light]{--bg:#eef0fa;--tx:#171a2e;--mu:#5f6584;--card:rgba(255,255,255,.78);--bd:rgba(20,20,60,.12);--in:rgba(20,20,60,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:thin;scrollbar-color:#3a3f66 transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;will-change:transform}
.bg i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:#6d3bff;animation:d1 22s ease-in-out infinite alternate,pu 8s ease-in-out infinite}
.bg i:nth-child(2){width:40vmax;height:40vmax;right:-12vmax;top:20vh;background:#ff3d9a;animation:d2 18s ease-in-out infinite alternate,pu 9s ease-in-out infinite}
.bg i:nth-child(3){width:48vmax;height:48vmax;right:-10vmax;bottom:-22vmax;background:#00c8e8;animation:d3 27s ease-in-out infinite alternate,pu 7s ease-in-out infinite}
.bg i:nth-child(4){width:36vmax;height:36vmax;left:25vw;bottom:-25vmax;background:#3d6bff;animation:d2 24s ease-in-out infinite alternate-reverse,pu 9s ease-in-out infinite}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vw,10vh) scale(1.2)}}
@keyframes d3{to{transform:translate(-14vw,-16vh) scale(1.1)}}
@keyframes pu{50%{opacity:.22}}
@keyframes sp{to{transform:rotate(360deg)}}
html[data-th=light] .bg i{opacity:.22}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
#app{position:relative;z-index:1;min-height:100vh}
h1,h2,h3{margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.c{text-align:center}
.gt{background:linear-gradient(90deg,#a78bff,#00d0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(7,9,20,.62);border-bottom:1px solid var(--bd)}
html[data-th=light] .top{background:rgba(238,240,250,.75)}
.hin{max-width:1050px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.lg{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 18px rgba(124,92,255,.45)}
.hr{display:flex;align-items:center;gap:8px}
.upill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.bdg{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:99px;background:var(--in);color:var(--mu);display:inline-block}
.bdg.a{background:var(--pk);color:#fff}.bdg.p{background:linear-gradient(90deg,#ffb020,#ff7a45);color:#1a1100}.bdg.bn{background:var(--err);color:#fff;margin-left:4px}
.ibtn{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px;display:grid;place-items:center;flex:none;padding:0}
.ibtn .dot{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#888}
.ibtn.ok .dot{background:var(--ok)}.ibtn.sync .dot{background:var(--warn);animation:pu 1s infinite}.ibtn.off .dot{background:var(--err)}
.page{max-width:1050px;margin:0 auto;padding:18px 16px 70px}
.ann{padding:12px 16px;border-radius:14px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.4);margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.tab{padding:9px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;font:inherit;font-weight:600;font-size:14px}
.tab.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 22px rgba(124,92,255,.4)}
.pt{font-size:28px;font-weight:800;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html[data-th=light] .card{box-shadow:0 4px 24px rgba(40,40,100,.07)}
.lb{display:block;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 7px}
.lb:first-child{margin-top:0}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:#161a33;color:#fff}
html[data-th=light] select option{background:#fff;color:#171a2e}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;height:6px;accent-color:#7c5cff;margin:14px 0 4px}
.bud{position:relative}.bud input{font-size:30px;font-weight:800;padding:14px 50px 14px 18px}
.bud span{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--in);color:var(--tx);cursor:pointer;font:inherit;font-size:13px}
.chip:hover{border-color:var(--ac)}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:14px;background:var(--in);border:1px solid var(--bd)}
.sg{flex:1 1 auto;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--mu);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.sg.on{background:var(--g);color:#fff}
.stabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.stab{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--in);color:var(--mu);cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.stab.on{background:var(--g);color:#fff;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:18px;box-shadow:0 8px 28px rgba(124,92,255,.4)}
.btn.sm{padding:8px 14px;font-size:13px}.btn.gh{background:var(--in);border:1px solid var(--bd);color:var(--tx)}.btn.dn{background:var(--err)}.btn:disabled{opacity:.5;cursor:wait}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.res .rh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.rt{font-size:18px;font-weight:800}.rp{font-size:24px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.prow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.pi{font-size:22px;width:30px;text-align:center}.pm{flex:1;min-width:0}.pn{font-weight:600}.ps{font-size:12.5px;color:var(--mu)}.pp{font-weight:700;white-space:nowrap}
.bar{height:5px;border-radius:9px;background:var(--in);margin-top:6px;overflow:hidden}.bar b{display:block;height:100%;background:var(--g)}
.sls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sl{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--in);border:1px solid var(--bd);color:var(--tx);text-decoration:none}.sl:hover{border-color:var(--ac)}
details summary{cursor:pointer;color:#9fb0ff;font-size:13px;margin-top:4px}
.note{padding:11px 14px;border-radius:12px;background:var(--in);border:1px dashed var(--bd);color:var(--mu);font-size:13.5px;margin-top:12px}
.note.pr{border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.08)}
.err2{padding:14px;border-radius:12px;background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.ld{display:flex;align-items:center;gap:12px}.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--ac);animation:sp .8s linear infinite}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:16px}
.lcard{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--bd)}
.lcard img,.noimg{width:96px;height:96px;object-fit:contain;border-radius:10px;background:#fff;flex:none}.noimg{display:grid;place-items:center;font-size:34px;background:var(--in)}
.ltt{font-size:13.5px;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lpr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.lpr b{font-size:18px}.lpr s{color:var(--mu);font-size:13px}.disc{background:var(--err);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--bd)}.stat b{display:block;font-size:26px;font-weight:800}.stat span{font-size:12px;color:var(--mu)}
.urow{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--bd)}
.ua{display:flex;gap:6px;flex-wrap:wrap}
.erow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.erow3{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.logr{font-size:13px;padding:5px 0;border-top:1px solid var(--bd)}
.ctbl{width:100%;border-collapse:collapse}.ctbl td,.ctbl th{padding:9px 8px;border-top:1px solid var(--bd);text-align:left}.ctbl th{color:var(--mu);font-size:12px;text-transform:uppercase}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.acard{width:100%;max-width:420px;padding:28px}
.alogo{display:flex;justify-content:center;margin-bottom:10px}.alogo .lg{width:56px;height:56px;border-radius:16px;font-size:28px}
.atitle{text-align:center;font-size:30px;font-weight:800}
.seg2{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--in);border:1px solid var(--bd);margin:18px 0 6px}
.seg2 button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}.seg2 button.on{background:var(--g);color:#fff}
.rec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.caprow{display:flex;gap:8px;align-items:center}.caprow canvas{border-radius:10px;border:1px solid var(--bd);flex:none;background:#12162c}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer}
.amsg{min-height:20px;margin-top:12px;font-size:14px;color:var(--err);text-align:center}.amsg.ok{color:var(--ok)}
.cl{margin-top:14px;text-align:center;font-size:12px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{background:#1b1f3d;color:#fff;padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px;max-width:90vw}
#err{position:fixed;left:10px;right:10px;bottom:10px;z-index:300;background:#4a1020;color:#fff;border:1px solid var(--err);border-radius:12px;padding:12px 14px;font-size:13px}
#err button{margin-left:8px;padding:5px 10px;border-radius:8px;border:0;cursor:pointer}
.bnav{display:none}
@media(max-width:820px){
 .tabs{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,12,28,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 html[data-th=light] .bnav{background:rgba(245,246,255,.94)}
 .bnav button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;cursor:pointer}
 .bnav button span{font-size:19px}.bnav button.on{color:#fff}.bnav button.on span{filter:drop-shadow(0 0 6px #7c5cff)}
 html[data-th=light] .bnav button.on{color:#7c5cff}
 .page{padding-bottom:100px}.pt{font-size:23px}.grid2,.grid3{grid-template-columns:1fr}
 .un,.upill .bdg{display:none}.upill{padding:4px}
 .erow,.erow3{grid-template-columns:1fr 1fr}
 .bud input{font-size:24px}.rp{font-size:19px}
}
</style>

const W={gaming:{cpu:2.2,gpu:5,mb:.35,ram:.7,ssd:.5,psu:.4,case:.25,cooler:.35},work:{cpu:4.5,gpu:1.8,mb:.5,ram:1.4,ssd:.9,psu:.4,case:.2,cooler:.5},stream:{cpu:3.2,gpu:3.6,mb:.4,ram:1,ssd:.7,psu:.4,case:.25,cooler:.4},office:{cpu:3,gpu:.5,mb:.4,ram:1.2,ssd:1.3,psu:.4,case:.3,cooler:.2}};
const MINR={gaming:16,work:32,stream:32,office:8},MINS={gaming:500,work:1000,stream:500,office:256};
const NOGPU={id:'none',cat:'gpu',name:'Вбудована графіка',price:0,score:0,tdp:0};
const vrmOk=(c,m)=>(c.tdp>=120?3:c.tdp>=100?2:1)<=(m.vrm||1);
function pareto(list){list=list.slice().sort((a,b)=>P(a.price)-P(b.price)||b.score-a.score);const r=[];let ms=-1;for(const x of list){if(x.score>ms){r.push(x);ms=x.score}}return r}
function buildPC(budget,purpose,flt,mode){
 flt=flt||{};const B=budget*(mode==='eco'?.78:mode==='bal'?.9:1),w=W[purpose]||W.gaming;
 const ps=L('parts'),by=c=>ps.filter(p=>p.cat===c),ok=(v,b)=>!v||v==='any'||v===b;
 const cpus=by('cpu').filter(c=>ok(flt.cpu,c.brand));
 const gpus=by('gpu').filter(g=>ok(flt.gpu,g.brand)).sort((a,b)=>a.price-b.price);
 if(purpose==='office'&&(!flt.gpu||flt.gpu==='any'))gpus.unshift(NOGPU);
 const mbs=by('mb'),psus=by('psu'),cools=by('cooler');
 const minR=MINR[purpose]||16,minS=MINS[purpose]||500;
 const ramP={4:pareto(by('ram').filter(r=>r.ddr===4&&r.size>=minR)),5:pareto(by('ram').filter(r=>r.ddr===5&&r.size>=minR))};
 const ssdP=pareto(by('ssd').filter(s=>s.size>=minS)),caseP=pareto(by('case'));
 const sumW=Object.values(w).reduce((a,b)=>a+b,0);
 let best=null,minCost=Infinity;
 if(!ssdP.length||!caseP.length)return {fail:1,min:null};
 for(const c of cpus)for(const g of gpus){
  if(g===NOGPU&&!c.igpu)continue;
  const base=P(c.price)+P(g.price),need=(c.tdp+(g.tdp||0)+80)*1.25;
  const psuP=pareto(psus.filter(p=>p.watt>=need)),coolP=pareto(cools.filter(k=>k.cap>=c.tdp&&!(c.nb&&k.stock)));
  if(!psuP.length||!coolP.length)continue;
  let pen=0;if(purpose==='gaming'||purpose==='stream'){const d=g.score-c.score;if(d>20)pen=(d-20)*2.5;if(-d>35)pen=(-d-35)*1.5}
  for(const m of mbs){
   if(m.sock!==c.sock||!vrmOk(c,m))continue;
   const rP=ramP[m.ddr];if(!rP||!rP.length)continue;
   const ls={ram:rP,ssd:ssdP,psu:psuP,case:caseP,cooler:coolP},ix={ram:0,ssd:0,psu:0,case:0,cooler:0};
   let cost=base+P(m.price);for(const k in ls)cost+=P(ls[k][0].price);
   if(cost<minCost)minCost=cost;if(cost>B)continue;
   for(;;){
    let bk=null,bj=0,br=0;
    for(const k in ls){const a=ls[k],cur=a[ix[k]];for(let j=ix[k]+1;j<a.length;j++){const d=P(a[j].price)-P(cur.price);if(cost+d>B)break;const r=w[k]*(a[j].score-cur.score)/Math.max(d,50);if(r>br){br=r;bk=k;bj=j}}}
    if(!bk)break;cost+=P(ls[bk][bj].price)-P(ls[bk][ix[bk]].price);ix[bk]=bj;
   }
   let sc=w.cpu*c.score+w.gpu*g.score+w.mb*m.score-pen;for(const k in ls)sc+=w[k]*ls[k][ix[k]].score;
   if(!best||sc>best.score)best={score:sc,total:cost,need,parts:{cpu:c,gpu:g===NOGPU?null:g,mb:m,ram:ls.ram[ix.ram],ssd:ls.ssd[ix.ssd],psu:ls.psu[ix.psu],case:ls.case[ix.case],cooler:ls.cooler[ix.cooler]}};
  }
 }
 if(!best)return {fail:1,min:minCost===Infinity?null:minCost};
 best.rating=Math.max(1,Math.min(100,Math.round(best.score/sumW)));best.purpose=purpose;best.budget=budget;return best;
}

async function jget(url){
 const own=LS.get('api','');const tries=[];
 if(own)tries.push(own.replace(/\/$/,'')+'/?url='+encodeURIComponent(url));
 tries.push('https://corsproxy.io/?url='+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url),url);
 let err;for(const t of tries){try{const r=await tf(t,{},9000);if(!r.ok)throw new Error('HTTP '+r.status);return JSON.parse(await r.text())}catch(e){err=e}}
 throw err||new Error('Немає відповіді');

 const s=await jget('https://search.rozetka.com.ua/ua/search/api/v6/?front-type=xl&country=UA&lang=ua&text='+encodeURIComponent(q)+'&page=1');
 const ids=((s&&s.data&&s.data.goods)||[]).map(x=>typeof x==='object'?x.id:x).filter(Boolean).slice(0,60);

 for(let i=0;i<ids.length;i+=30){
  const d=await jget('https://xl-catalog-api.rozetka.com.ua/v4/goods/get?front-type=xl&country=UA&lang=ua&with_groups=1&with_docket=0&id='+ids.slice(i,i+30).join(','));
  out=out.concat(Array.isArray(d.data)?d.data:Object.values(d.data||{}));
 }
 return out.map(g=>({title:g.title||'',url:/^https?:/.test(g.href||'')?g.href:(g.href?'https://rozetka.com.ua'+g.href:''),price:+g.price||0,old:+g.old_price||0,img:g.image_main||(g.images&&g.images.main)||'',ok:!g.sell_status||g.sell_status==='available'}));

async function redeem(){
 const code=($('#promo').value||'').trim().toUpperCase();if(!code)return toast('Введіть промокод');
 if(U.builtin)return toast('Адміністратор уже має Premium');
 await sync(false);
 const p=L('promos').find(x=>x.code===code);
 if(!p||p.uses<=0)return toast('Невірний або вичерпаний промокод');
 if((p.usedBy||[]).includes(U.id))return toast('Ви вже використовували цей код');
 const cur=getUser(U.id)||U,base=(cur.tariff==='premium'&&cur.until&&cur.until>Date.now())?cur.until:Date.now();
 const nu={...cur,tariff:'premium',until:base+p.days*864e5};upd('users',nu);U=nu;
 p.uses--;p.usedBy=[...(p.usedBy||[]),U.id];upd('promos',p);log('Промокод '+code);
 await sync(false);render();toast('Premium активовано на '+p.days+' дн. 💎');
}

 ufree:t=>{const u=L('users').find(x=>x.id===t.dataset.v);if(!u)return;upd('users',{...u,tariff:'free',until:null});renderView()},
 uban:t=>{const u=L('users').find(x=>x.id===t.dataset.v);if(!u)return;upd('users',{...u,banned:u.banned?0:1});log((u.banned?'Розбан ':'Бан ')+u.nick);renderView()},
 upw:async t=>{const u=L('users').find(x=>x.id===t.dataset.v);if(!u)return;const p=prompt('Новий пароль для '+u.nick+' (мін. 6 символів):');if(!p||p.length<6)return;const salt=uid();upd('users',{...u,salt,hash:await hpw(p,salt)});toast('Пароль змінено');log('Скинуто пароль '+u.nick)},
 urole:t=>{const u=L('users').find(x=>x.id===t.dataset.v);if(!u)return;if(!confirm((u.role==='admin'?'Забрати права адміна у ':'Зробити адміном ')+u.nick+'?'))return;upd('users',{...u,role:u.role==='admin'?'user':'admin'});renderView()},
 udel:t=>{const u=L('users').find(x=>x.id===t.dataset.v);if(u&&confirm('Видалити '+u.nick+'?')){del('users',u);log('Видалено '+u.nick);renderView()}},
 /* універсальне */
 idel:t=>{const c=t.dataset.c,it=DB[c].find(x=>x.id===t.dataset.v);if(it&&confirm('Видалити?')){del(c,it);renderView()}},
 itog:t=>{const c=t.dataset.c,it=DB[c].find(x=>x.id===t.dataset.v);if(it){it[t.dataset.f]=it[t.dataset.f]?0:1;upd(c,it);renderView()}},
 paradd:()=>{const c=S.ap.cat,name=$('#ap_name').value.trim(),price=+$('#ap_price').value,score=+$('#ap_score').value;if(!name||!(price>=0)||!(score>0))return toast('Заповніть назву, ціну та якість');const o={id:'x'+uid(),cat:c,name,price,score};($('#ap_par').value||'').split(/\s+/).filter(Boolean).forEach(kv=>{const i=kv.indexOf('=');if(i>0){const v=kv.slice(i+1);o[kv.slice(0,i)]=v!==''&&!isNaN(v)?+v:v}});if(!partOk(o))return toast('Не вистачає обовʼязкових параметрів. Приклад: '+PHINT[c]);upd('parts',o);toast('Додано');renderView()},
 preadd:()=>{const name=$('#pr_name').value.trim(),b=+$('#pr_bud').value;if(!name||!(b>=5000))return toast('Назва та бюджет від 5000');upd('presets',{id:'x'+uid(),name,purpose:$('#pr_pur').value,budget:b,on:1});renderView()},
 stadd:()=>{const name=$('#st_name').value.trim(),url=$('#st_url').value.trim();if(!name||!/^https?:\/\//.test(url)||!url.includes('{q}'))return toast('Потрібні назва та URL з {q}');upd('stores',{id:'x'+uid(),name,url,on:1});renderView()},
 pmadd:()=>{const days=Math.max(1,parseInt($('#pm_days').value,10)||30),uses=Math.max(1,parseInt($('#pm_uses').value,10)||1),al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=n=>Array.from({length:n},()=>al[Math.floor(Math.random()*al.length)]).join('');upd('promos',{id:uid(),code:'PRM-'+r(4)+'-'+r(4),days,uses,usedBy:[],created:Date.now()});renderView()},
 pmcopy:t=>copyTxt(t.dataset.v),
 export:()=>{const b=new Blob([JSON.stringify(payload(),null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pcforge-'+new Date().toISOString().slice(0,10)+'.json';a.click()},
 resetparts:()=>{if(!confirm('Повернути каталог до стандартного? Власні деталі буде видалено.'))return;const ids=new Set(SEEDP.map(x=>x.id));DB.parts.forEach(p=>{if(!ids.has(p.id)){p._d=1;p._ts=Date.now()}});save('parts');repairSeed('parts',SEEDP,true);schedule(500);toast('Каталог скинуто');renderView()},
 clearlocal:()=>{if(confirm('Очистити локальні дані цього пристрою? (Дані в хмарі залишаться)'))resetLocal()}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const fn=ACT[t.dataset.a];if(!fn)return;
 Promise.resolve().then(()=>fn(t,e)).catch(showErr);
});
function bindVal(t){
 const g=t.dataset.g,k=t.dataset.k;if(!g||!k||t.dataset.a==='seg')return;
 S[g][k]=t.value;
 const bx=t.closest&&t.closest('.budbox');if(bx){if(t.classList.contains('budn'))$('.budr',bx).value=t.value;else $('.budn',bx).value=t.value}
 saveUI();
}
document.addEventListener('input',e=>bindVal(e.target));
document.addEventListener('change',e=>{
 const t=e.target;bindVal(t);
 if(t.dataset&&t.dataset.ch==='iedit'){const c=t.dataset.c,it=DB[c].find(x=>x.id===t.dataset.v);if(!it)return;let v=t.value;if(t.type==='number')v=+v;if(t.dataset.f==='url'&&!String(v).includes('{q}'))return toast('У посиланні потрібен {q}');it[t.dataset.f]=v;upd(c,it);toast('Збережено ✓')}
 if(t.dataset&&t.dataset.ch==='import'&&t.files&&t.files[0]){
  const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);merge(o);COLS.forEach(c=>DB[c].forEach(x=>{if(o[c]&&o[c].find&&o[c].find(y=>y.id===x.id))x._ts=Math.max(x._ts||0,1)}));PM={};sync(true);toast('Імпортовано ✅');renderView()}catch(er){toast('Невірний файл JSON')}};fr.readAsText(t.files[0]);
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('.acard')){const b=$('#asub');if(b&&!b.disabled)b.click()}});

/* ====== Запуск (завжди в самому кінці) ====== */
(function init(){
 try{
  const h=location.hash;
  if(/cloud=|api=/.test(h)){const m=h.match(/cloud=([^&]+)/),a=h.match(/api=([^&]+)/);if(m)LS.set('cloud',parseId(decodeURIComponent(m[1])));if(a)LS.set('api',decodeURIComponent(a[1]));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  cloudId=CLOUD_ID||LS.get('cloud','');
  seedAll();
  document.documentElement.dataset.th=LS.get('theme','dark');
  const sid=LS.get('session','');
  if(sid){const u=getUser(sid);if(u&&!u.banned){U=u;loadUI()}}
  setC(cloudId?'sync':'local');
  render();
 }catch(e){showErr(e);try{U=null;renderAuth()}catch(e2){}}
 sync(false);
 setInterval(()=>{if(!document.hidden)sync(false)},30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
 window.addEventListener('online',()=>sync(false));
})();
</script>
