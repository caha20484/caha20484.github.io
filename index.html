<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PC Forge — конфігуратор ПК</title>
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#e9ecff;--mu:#8d93b8;--v:#7c5cff;--c:#22d3ee;--p:#ff4fa3;--ok:#34d399;--wr:#fbbf24;--er:#f87171;--g:linear-gradient(90deg,#7c5cff,#22d3ee)}
html.light{--bg:#f2f4fb;--card:rgba(255,255,255,.85);--bd:rgba(20,20,60,.13);--tx:#161a36;--mu:#5d6488}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh}
.hd{display:flex;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--bd);backdrop-filter:blur(14px);background:rgba(7,9,20,.55);position:sticky;top:0;z-index:20}
html.light .hd{background:rgba(255,255,255,.7)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo.c{justify-content:center;font-size:24px;margin-bottom:4px}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#ff4fa3);display:grid;place-items:center;font-size:17px}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--bd);border-radius:99px;background:var(--card);font-weight:600;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#ff4fa3);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.bdg{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.5px}
.b-admin{background:#ff4fa3;color:#fff}.b-pro{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#2a1a00}.b-free{background:rgba(255,255,255,.14);color:var(--mu)}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px;position:relative;padding:0;display:inline-grid;place-items:center;flex:none}
.dot{position:absolute;right:1px;top:1px;width:10px;height:10px;border-radius:50%;background:#777;border:2px solid var(--bg)}
.ok .dot{background:var(--ok)}.sync .dot{background:var(--wr)}.off .dot{background:var(--er)}
.ann{background:linear-gradient(90deg,rgba(124,92,255,.25),rgba(34,211,238,.2));border-bottom:1px solid var(--bd);padding:8px 20px;text-align:center;font-size:14px}
.page{max-width:1000px;margin:0 auto;padding:18px 16px 100px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.tab{padding:9px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit}
.tab.on{background:var(--g);color:#fff;border-color:transparent}
.ttl{font-size:28px;margin:6px 0 4px;font-weight:800}
.sub{color:var(--mu);margin:0 0 16px}.sub.c{text-align:center}
.h3{margin:26px 0 4px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:16px;backdrop-filter:blur(12px)}
.lb{display:block;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 7px;font-weight:700}
.lb:first-child{margin-top:0}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 13px;font:inherit;outline:none}
html.light input,html.light select{background:rgba(255,255,255,.9)}
input:focus,select:focus,textarea:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
select option{background:#12142b;color:#e9ecff}
html.light select option{background:#fff;color:#161a36}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:center;font-size:14px;margin:12px 0;color:var(--mu)}
.bud{position:relative}.bud input{font-size:30px;font-weight:800;padding:14px 50px 14px 16px}
.bud b{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--mu)}
.rng{margin-top:14px;padding:0;height:6px;accent-color:var(--v);background:transparent;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.chip:hover{border-color:var(--v)}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:14px;padding:5px}
.seg button{flex:1;min-width:110px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--mu);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit}
.seg button.on{background:var(--g);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:140px}
.big{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#7c5cff,#c04bff 50%,#22d3ee);color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(124,92,255,.35)}
.big:active{transform:scale(.99)}
.btn{padding:9px 15px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--v)}.btn.d{border-color:rgba(248,113,113,.5);color:var(--er)}.btn.s{padding:5px 10px;font-size:12px}
.note{font-size:13px;color:var(--mu);margin-top:10px}.note.pr{color:var(--wr)}
.msg{padding:12px 14px;border-radius:12px;margin-top:14px;font-size:14px;border:1px solid}
.msg.er{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4);color:#fca5a5}
html.light .msg.er{color:#b91c1c}
.msg.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);color:var(--ok)}
.msg.in{background:rgba(124,92,255,.1);border-color:rgba(124,92,255,.35);color:var(--tx)}
.bc .bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.bt{font-weight:800;font-size:18px}.bs{color:var(--mu);font-size:13px}
.btot{font-size:24px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.prow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--bd)}
.pi{font-size:22px;width:34px;text-align:center;flex:none}
.pm{flex:1;min-width:0}.pn{font-weight:600}
.pp{font-weight:800;white-space:nowrap}
.tgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tg{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(124,92,255,.16);color:#b9a8ff;font-weight:600}
html.light .tg{color:#5b3fe0}
.shops{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.shop{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--c);text-decoration:none;font-weight:600}
.shop:hover{border-color:var(--c)}
.cks{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7}
.cks.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.cks.bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.4)}
.cks b{display:block;margin-bottom:3px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.lc{border:1px solid var(--bd);border-radius:16px;padding:12px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:8px}
.lc img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:10px}
.lt{font-size:13px;font-weight:600;flex:1}.lp{font-weight:800;font-size:17px}.lp s{font-size:12px;color:var(--mu);font-weight:400;margin-left:6px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.st{padding:8px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.st.on{background:rgba(124,92,255,.25);color:var(--tx);border-color:var(--v)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:800}.stat span{font-size:12px;color:var(--mu)}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{padding:9px 8px;border-top:1px solid var(--bd);text-align:left;vertical-align:middle}
.tb th{color:var(--mu);font-size:11px;text-transform:uppercase;border-top:0}
.tw{overflow-x:auto}
.plan h3{margin:0 0 8px}.plan ul{margin:0;padding-left:18px;line-height:1.9}.plan li.no{color:var(--mu);list-style:"✖ "}
.plan.pr{border-color:rgba(251,191,36,.5)}
.lgx{max-height:240px;overflow:auto;font-size:12px;color:var(--mu);line-height:1.7}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.acard{width:100%;max-width:410px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:26px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.acard .seg{margin-bottom:14px}
.capr{display:flex;gap:8px;align-items:center}.capr canvas{border-radius:10px;border:1px solid var(--bd);flex:none}
.amsg{min-height:20px;margin-top:10px;font-size:14px;color:var(--er)}.amsg.ok{color:var(--ok)}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,12,26,.92);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
html.light .bnav{background:rgba(255,255,255,.95)}
.bnav button{flex:1;background:none;border:0;color:var(--mu);font-size:10px;padding:5px 2px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button span{font-size:19px}.bnav button.on{color:var(--c)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1b1f3d;color:#fff;border:1px solid var(--bd);padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.ok{border-color:var(--ok)}#toast.er{border-color:var(--er)}
#err{position:fixed;left:0;right:0;top:0;z-index:100;background:#b91c1c;color:#fff;padding:10px 16px;font-size:14px}
#err button{margin-left:10px;padding:4px 10px;border-radius:8px;border:0;cursor:pointer}
@media(max-width:820px){.tabs{display:none}.bnav{display:flex}.hd{padding:10px 12px}.pill .nm{display:none}.pill{padding:4px}.ttl{font-size:23px}.g2,.g3{grid-template-columns:1fr}.page{padding:14px 12px 100px}.logo{font-size:17px}}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="app"></div>
<script>
'use strict';
/* ====== НАЛАШТУВАННЯ ====== */
const CLOUD_ID='https://pcforge-01-default-rtdb.firebaseio.com'; /* адреса Firebase Realtime Database */
const ADMIN_NICK='project',ADMIN_PASS='Password';
const FREE={pc:1,parts:5,ready:4,save:3};
const COLS=['users','parts','stores','presets','promos','saved','log','settings'];
const SYNC=['users','parts','stores','presets','promos','saved','settings'];
const SEEDV='3';
const TYPES={cpu:['🧠','Процесор'],cooler:['❄️','Охолодження'],mb:['🧩','Материнська плата'],ram:['💾','Оперативна пам’ять'],gpu:['🎮','Відеокарта'],ssd:['⚡','SSD'],psu:['🔌','Блок живлення'],case:['🏠','Корпус']};
const ORDER=['cpu','cooler','mb','ram','gpu','ssd','psu','case'];
const PURP={gaming:'Ігровий',work:'Робочий (монтаж/3D)',stream:'Стрім + ігри',office:'Офіс/навчання'};
/* ====== УТИЛІТИ ====== */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('uk-UA')+' ₴';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const lsg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dt=t=>new Date(t).toLocaleDateString('uk-UA');
function toast(m,k){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.className='show '+(k||'');t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},3400)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){prompt('Скопіюйте:',t);return false}}
function showErr(e){let b=$('#err');if(!b){b=document.createElement('div');b.id='err';document.body.appendChild(b)}b.innerHTML='⚠️ '+esc((e&&e.message)||e)+' <button data-a="resetlocal">Скинути локальні дані</button>'}
window.addEventListener('error',ev=>{if(ev.error)showErr(ev.error)});
/* ====== БАЗА ====== */
const DB={};
const REQ={cpu:['sock','tdp'],gpu:['tdp'],mb:['sock','ddr','vrm'],ram:['ddr','size'],ssd:['size'],psu:['watt'],cooler:['cap'],case:['forms']};
const NUMF=['tdp','vrm','size','watt','cap'];
function partOk(p){if(!p||!p.id||!p.type||!p.name||!(+p.price>0))return false;const r=REQ[p.type];if(!r)return false;for(const f of r){if(p[f]==null||p[f]==='')return false;if(NUMF.includes(f)&&!(+p[f]>0))return false}return true}
const VAL={parts:partOk,stores:s=>s&&s.id&&s.name&&String(s.url||'').includes('{q}'),presets:p=>p&&p.id&&p.name&&+p.budget>0&&PURP[p.purpose],users:u=>u&&u.id&&u.nick&&u.hash,promos:p=>p&&p.id&&p.code,saved:s=>s&&s.id&&s.uid&&Array.isArray(s.ids),log:x=>x&&x.id,settings:x=>x&&x.id};
function load(c){let a=lsg('pcf_'+c,[]);if(!Array.isArray(a))a=[];DB[c]=a.filter(x=>x&&x.id&&(!VAL[c]||VAL[c](x)))}
function save(c){lss('pcf_'+c,DB[c])}
const L=c=>DB[c].filter(x=>!x._d);
const GI=(c,id)=>DB[c].find(x=>x.id===id&&!x._d);
function upd(c,it){it._ts=Date.now();const i=DB[c].findIndex(x=>x.id===it.id);if(i<0)DB[c].push(it);else DB[c][i]=it;save(c);if(SYNC.includes(c))schedule(1500);return it}
function del(c,id){const it=DB[c].find(x=>x.id===id);if(it){it._d=1;it._ts=Date.now();save(c);if(SYNC.includes(c))schedule(1500)}}
function logEv(m){DB.log.push({id:uid(),t:Date.now(),m,u:(ME&&ME.nick)||'—',_ts:Date.now()});if(DB.log.length>80)DB.log.splice(0,DB.log.length-80);save('log')}
const gs=(k,d)=>{const s=DB.settings.find(x=>x.id===k&&!x._d);return s&&s.v!=null?s.v:d};
const ss=(k,v)=>upd('settings',{id:k,v});
const P=x=>Math.round(x*(+gs('mult',1)||1));
/* ====== КАТАЛОГ (сид) ====== */
const SEEDP=[];
function brandOf(t,n){if(t==='cpu')return /ryzen|amd/i.test(n)?'AMD':'Intel';if(t==='gpu')return /rtx|gtx|geforce/i.test(n)?'NVIDIA':'AMD';return n.split(' ')[0]}
function sp(type,name,price,o){SEEDP.push(Object.assign({id:'s_'+type+'_'+name.toLowerCase().replace(/[^a-z0-9а-яіїє]+/g,''),type,name,price,brand:brandOf(type,name),_ts:1},o))}
const aC=(n,pr,sock,tdp,cores,igpu,vrm,perf)=>sp('cpu',n,pr,{sock,tdp,cores,igpu,vrm,perf});
const aG=(n,pr,tdp,vram,perf)=>sp('gpu',n,pr,{tdp,vram,perf});
const aM=(n,pr,sock,ddr,vrm,ff)=>sp('mb',n,pr,{sock,ddr,vrm,ff});
const aR=(n,pr,ddr,size)=>sp('ram',n,pr,{ddr,size});
const aS=(n,pr,size)=>sp('ssd',n,pr,{size});
const aP=(n,pr,watt)=>sp('psu',n,pr,{watt});
const aK=(n,pr,cap,socks)=>sp('cooler',n,pr,{cap,socks});
const aB=(n,pr,forms)=>sp('case',n,pr,{forms});
/* CPU: назва, ціна, сокет, TDP, ядер, iGPU, мін. клас VRM, індекс ігрової продуктивності (12400F=100) */
aC('Ryzen 5 5500',3300,'AM4',65,6,0,1,90);aC('Ryzen 5 5600',4300,'AM4',65,6,0,1,100);aC('Ryzen 5 5600G',4700,'AM4',65,6,1,1,92);
aC('Ryzen 7 5700X',6500,'AM4',65,8,0,1,110);aC('Ryzen 7 5700X3D',9800,'AM4',105,8,0,2,140);aC('Ryzen 7 5800X3D',11800,'AM4',105,8,0,2,145);
aC('Ryzen 5 7500F',6600,'AM5',65,6,0,1,130);aC('Ryzen 5 7600',8200,'AM5',65,6,1,1,135);aC('Ryzen 5 9600X',10500,'AM5',65,6,1,1,150);
aC('Ryzen 7 7700',11200,'AM5',65,8,1,1,148);aC('Ryzen 7 9700X',14500,'AM5',65,8,1,1,160);aC('Ryzen 7 7800X3D',16800,'AM5',120,8,1,2,190);
aC('Ryzen 7 9800X3D',21500,'AM5',120,8,1,2,215);aC('Ryzen 9 7900X',15800,'AM5',170,12,1,3,165);aC('Ryzen 9 9900X',19500,'AM5',120,12,1,2,175);aC('Ryzen 9 9950X',27500,'AM5',170,16,1,3,185);
aC('Core i3-12100F',3300,'LGA1700',58,4,0,1,80);aC('Core i3-12100',4400,'LGA1700',60,4,1,1,80);aC('Core i5-12400F',5300,'LGA1700',65,6,0,1,100);
aC('Core i5-12400',6500,'LGA1700',65,6,1,1,100);aC('Core i5-13400F',7400,'LGA1700',65,10,0,1,108);aC('Core i5-13600K',11500,'LGA1700',181,14,1,2,140);
aC('Core i5-14600K',13500,'LGA1700',181,14,1,2,145);aC('Core i7-13700K',15500,'LGA1700',253,16,1,3,155);aC('Core i7-14700K',17500,'LGA1700',253,20,1,3,165);aC('Core i9-14900K',24000,'LGA1700',253,24,1,3,180);
/* Материнські плати: сокет, тип DDR, клас VRM (1–3), форм-фактор */
aM('Gigabyte B450M DS3H',2800,'AM4','DDR4',1,'mATX');aM('Gigabyte B550M DS3H',3600,'AM4','DDR4',1,'mATX');aM('MSI B550-A PRO',4600,'AM4','DDR4',2,'ATX');
aM('ASUS TUF Gaming B550-PLUS',5600,'AM4','DDR4',2,'ATX');aM('MSI MAG B550 Tomahawk',6500,'AM4','DDR4',3,'ATX');
aM('ASRock A620M-HDV/M.2+',3300,'AM5','DDR5',1,'mATX');aM('Gigabyte B650M DS3H',5200,'AM5','DDR5',2,'mATX');aM('MSI MAG B650 Tomahawk WiFi',8500,'AM5','DDR5',3,'ATX');

/* ====== АНІМОВАНИЙ ФОН ====== */
(function(){const cv=$('#bgc'),x=cv.getContext('2d');let w,h,dp,pts=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function rs(){dp=Math.min(devicePixelRatio||1,2);w=cv.width=innerWidth*dp;h=cv.height=innerHeight*dp}rs();addEventListener('resize',rs);
 const N=innerWidth<700?32:64;for(let i=0;i<N;i++)pts.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00022,vy:(Math.random()-.5)*.00022,r:Math.random()*1.6+.6});
 const bl=[[.15,.1,'124,92,255',0],[.88,.18,'255,79,163',2],[.5,.98,'34,211,238',4]];
 function f(t){x.clearRect(0,0,w,h);const light=document.documentElement.classList.contains('light'),m=Math.max(w,h);
  bl.forEach(b=>{const cx=(b[0]+Math.sin(t/6000+b[3])*.07)*w,cy=(b[1]+Math.cos(t/7000+b[3])*.07)*h,g=x.createRadialGradient(cx,cy,0,cx,cy,m*.5);g.addColorStop(0,'rgba('+b[2]+','+(light?.16:.22)+')');g.addColorStop(1,'rgba('+b[2]+',0)');x.fillStyle=g;x.fillRect(0,0,w,h)});
  pts.forEach(p=>{p.x+=p.vx*16;p.y+=p.vy*16;if(p.x<0||p.x>1)p.vx*=-1;if(p.y<0||p.y>1)p.vy*=-1});
  x.fillStyle=light?'rgba(90,70,200,.5)':'rgba(190,200,255,.55)';
  pts.forEach(p=>{x.beginPath();x.arc(p.x*w,p.y*h,p.r*dp,0,7);x.fill()});
  x.lineWidth=dp;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=(pts[i].x-pts[j].x)*w,dy=(pts[i].y-pts[j].y)*h,d=Math.sqrt(dx*dx+dy*dy);if(d<130*dp){x.strokeStyle=(light?'rgba(90,70,200,':'rgba(160,170,255,')+(.16*(1-d/(130*dp)))+')';x.beginPath();x.moveTo(pts[i].x*w,pts[i].y*h);x.lineTo(pts[j].x*w,pts[j].y*h);x.stroke()}}
  if(!reduce)requestAnimationFrame(f)}
 requestAnimationFrame(f)})();

function init(){
 COLS.forEach(load);seedAll();
 if(lsg('pcf_theme','dark')==='light')document.documentElement.classList.add('light');
 const hm=location.hash.match(/(cloud|api)=([^&]+)/g);
 if(hm){hm.forEach(s=>{const k=s.split('=')[0],v=decodeURIComponent(s.slice(k.length+1));if(k==='cloud'&&normUrl(v))lss('pcf_cloud',normUrl(v));if(k==='api')lss('pcf_api',v)});history.replaceState(null,'',location.pathname+location.search)}
 ME=curUser();if(ME)loadUI();
 render();doSync();setInterval(()=>{if(!document.hidden)doSync()},30000)}
try{init()}catch(e){showErr(e)}
</script>
